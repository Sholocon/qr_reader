<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QR Code 即時解讀工具</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --bg1: #0b1120;
      --bg2: #111827;
      --card: rgba(30, 41, 59, 0.65);
      --card-border: rgba(148, 163, 184, 0.15);
      --accent: #818cf8;
      --accent2: #6366f1;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #34d399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg1);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 40px;
      line-height: 1.55;
      /* 幾何圖案背景 */
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(129, 140, 248, 0.1) 0%, transparent 40%),
        linear-gradient(135deg, #0b1120 0%, #111827 50%, #0f172a 100%),
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 20px,
          rgba(148, 163, 184, 0.02) 20px,
          rgba(148, 163, 184, 0.02) 40px
        );
      background-attachment: fixed;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a5b4fc, #c4b5fd, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-top: 6px;
    }

    /* 目前結果 */
    .current-result {
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 22px;
      min-height: 150px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .current-result.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .result-type {
      background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(129,140,248,0.2));
      color: #a5b4fc;
      padding: 3px 12px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.03em;
    }

    .result-content {
      word-break: break-all;
      white-space: pre-wrap;
      font-size: 1.05rem;
    }

    .result-content.collapsed {
      max-height: 130px;
      overflow: hidden;
      position: relative;
    }

    .result-content.collapsed::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 50px;
      background: linear-gradient(transparent, rgba(30,41,59,0.95));
    }

    .expand-btn {
      display: inline-block;
      margin-top: 10px;
      color: var(--accent);
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
    }
    .expand-btn:hover { text-decoration: underline; }

    /* 結構化內容卡片 */
    .structured {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-top: 4px;
    }

    .structured .row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: flex-start;
    }
    .structured .row:last-child { margin-bottom: 0; }

    .structured .label {
      min-width: 70px;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .structured .value {
      flex: 1;
      word-break: break-all;
    }

    .structured a {
      color: #a5b4fc;
      text-decoration: none;
      font-weight: 500;
    }
    .structured a:hover { text-decoration: underline; }

    .copy-btn {
      background: rgba(99,102,241,0.2);
      color: #a5b4fc;
      border: none;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      margin-left: 8px;
    }
    .copy-btn:hover { background: rgba(99,102,241,0.35); }

    /* 上傳區 */
    .upload-bar {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 2px dashed rgba(148, 163, 184, 0.25);
      border-radius: 20px;
      padding: 28px 18px;
      text-align: center;
      margin-bottom: 32px;
      transition: all 0.25s;
      cursor: pointer;
    }

    .upload-bar:hover,
    .upload-bar.dragover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.1);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .upload-bar p {
      color: var(--text-muted);
      margin-bottom: 18px;
      font-size: 0.95rem;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: white;
      border: none;
      padding: 11px 20px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
    }

    .btn-secondary {
      background: rgba(51, 65, 85, 0.8);
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: rgba(71, 85, 105, 0.9);
      transform: translateY(-1px);
    }

    #fileInput { display: none; }

    /* 相機 */
    #camera-container {
      display: none;
      margin-bottom: 20px;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #camera-container video { width: 100%; display: block; }
    #camera-container .close-cam {
      position: absolute;
      top: 14px; right: 14px;
      background: rgba(0,0,0,0.65);
      color: white;
      border: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    /* 歷史 */
    .history-section h2 {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-item {
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 15px 17px;
      font-size: 0.92rem;
      transition: all 0.2s;
    }
    .history-item:hover {
      background: rgba(30, 41, 59, 0.85);
      border-color: rgba(148, 163, 184, 0.25);
    }

    .history-item .meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item .content {
      word-break: break-all;
      white-space: pre-wrap;
    }
    .history-item .content.collapsed {
      max-height: 72px;
      overflow: hidden;
      position: relative;
    }
    .history-item .content.collapsed::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 32px;
      background: linear-gradient(transparent, rgba(30,41,59,0.95));
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 13px 26px;
      border-radius: 14px;
      font-size: 0.9rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 100;
      border: 1px solid rgba(148,163,184,0.15);
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #7f1d1d; }
    .toast.success { background: #065f46; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>QR Code 即時解讀</h1>
      <p>貼上 / 上傳 / 掃描 → 自動解讀（支援網址・文字・簡訊・電話・Email・WiFi）</p>
    </header>

    <div id="currentResult" class="current-result empty">
      尚未掃描任何 QR Code
    </div>

    <div id="camera-container">
      <video id="cameraVideo" playsinline></video>
      <button class="close-cam" onclick="stopCamera()">×</button>
    </div>

    <div class="upload-bar" id="uploadBar">
      <p>📋 直接 <b>Ctrl + V</b> 貼上圖片　或　選擇以下方式</p>
      <div class="btn-group">
        <button class="btn" onclick="document.getElementById('fileInput').click()">
          📁 上傳圖片
        </button>
        <button class="btn btn-secondary" onclick="startCamera()">
          📷 用手機掃描
        </button>
      </div>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div class="history-section">
      <h2>
        <span>歷史記錄 <small style="font-weight:400">(最多 10 筆)</small></span>
        <button class="btn btn-secondary" style="padding:6px 14px;font-size:0.8rem" onclick="clearHistory()">清除全部</button>
      </h2>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let currentData = null;
    let history = [];
    let cameraStream = null;
    let scanning = false;

    // ===== 解析不同類型 =====
    function parseQR(text) {
      text = text.trim();

      // WiFi
      if (text.toUpperCase().startsWith('WIFI:')) {
        const parts = {};
        text.slice(5).split(';').forEach(p => {
          const [k, ...v] = p.split(':');
          if (k) parts[k.toUpperCase()] = v.join(':');
        });
        return {
          type: 'WiFi',
          raw: text,
          data: {
            ssid: parts.S || '',
            password: parts.P || '',
            encryption: parts.T || '無',
            hidden: parts.H === 'true'
          }
        };
      }

      // 電話
      if (text.toLowerCase().startsWith('tel:')) {
        return { type: '電話', raw: text, data: { number: text.slice(4) } };
      }

      // 簡訊
      if (text.toLowerCase().startsWith('sms:') || text.toUpperCase().startsWith('SMSTO:')) {
        let number = '', body = '';
        if (text.toUpperCase().startsWith('SMSTO:')) {
          const parts = text.slice(6).split(':');
          number = parts[0] || '';
          body = parts.slice(1).join(':') || '';
        } else {
          const url = new URL(text);
          number = url.pathname;
          body = url.searchParams.get('body') || '';
        }
        return { type: '簡訊', raw: text, data: { number, body } };
      }

      // Email (mailto 或 MATMSG)
      if (text.toLowerCase().startsWith('mailto:')) {
        const url = new URL(text);
        return {
          type: 'Email',
          raw: text,
          data: {
            to: url.pathname,
            subject: url.searchParams.get('subject') || '',
            body: url.searchParams.get('body') || ''
          }
        };
      }
      if (text.toUpperCase().startsWith('MATMSG:')) {
        const parts = {};
        text.slice(7).split(';').forEach(p => {
          const [k, ...v] = p.split(':');
          if (k) parts[k.toUpperCase()] = v.join(':');
        });
        return {
          type: 'Email',
          raw: text,
          data: {
            to: parts.TO || '',
            subject: parts.SUB || '',
            body: parts.BODY || ''
          }
        };
      }

      // URL
      try {
        const u = new URL(text);
        if (u.protocol === 'http:' || u.protocol === 'https:') {
          return { type: '網址', raw: text, data: { url: text } };
        }
      } catch {}

      // 預設文字
      return { type: '文字', raw: text, data: { text } };
    }

    // ===== 儲存 =====
    function loadFromStorage() {
      try {
        const saved = localStorage.getItem('qr_history');
        if (saved) history = JSON.parse(saved);
        const curr = localStorage.getItem('qr_current');
        if (curr) {
          currentData = JSON.parse(curr);
          renderCurrent();
        }
        renderHistory();
      } catch (e) {}
    }

    function saveToStorage() {
      try {
        localStorage.setItem('qr_history', JSON.stringify(history));
        if (currentData) localStorage.setItem('qr_current', JSON.stringify(currentData));
        else localStorage.removeItem('qr_current');
      } catch (e) {}
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + type;
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleString('zh-HK', {
        month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => showToast('已複製！'));
    }

    // ===== 渲染結構化內容 =====
    function renderStructured(parsed) {
      const d = parsed.data;
      let html = '<div class="structured">';

      if (parsed.type === 'WiFi') {
        html += `
          <div class="row"><span class="label">名稱 (SSID)</span><span class="value">${escapeHtml(d.ssid)} <button class="copy-btn" onclick="copyText('${escapeHtml(d.ssid)}')">複製</button></span></div>
          <div class="row"><span class="label">密碼</span><span class="value">${escapeHtml(d.password || '（無）')} <button class="copy-btn" onclick="copyText('${escapeHtml(d.password)}')">複製</button></span></div>
          <div class="row"><span class="label">加密</span><span class="value">${escapeHtml(d.encryption)}</span></div>
        `;
      } else if (parsed.type === '電話') {
        html += `<div class="row"><span class="label">電話</span><span class="value"><a href="tel:${escapeHtml(d.number)}">${escapeHtml(d.number)}</a></span></div>`;
      } else if (parsed.type === '簡訊') {
        html += `
          <div class="row"><span class="label">電話</span><span class="value"><a href="sms:${escapeHtml(d.number)}">${escapeHtml(d.number)}</a></span></div>
          <div class="row"><span class="label">內容</span><span class="value">${escapeHtml(d.body || '（無）')}</span></div>
        `;
      } else if (parsed.type === 'Email') {
        html += `
          <div class="row"><span class="label">收件人</span><span class="value"><a href="mailto:${escapeHtml(d.to)}">${escapeHtml(d.to)}</a></span></div>
          ${d.subject ? `<div class="row"><span class="label">主旨</span><span class="value">${escapeHtml(d.subject)}</span></div>` : ''}
          ${d.body ? `<div class="row"><span class="label">內容</span><span class="value">${escapeHtml(d.body)}</span></div>` : ''}
        `;
      } else if (parsed.type === '網址') {
        html += `<div class="row"><span class="label">網址</span><span class="value"><a href="${escapeHtml(d.url)}" target="_blank" rel="noopener">${escapeHtml(d.url)}</a></span></div>`;
      } else {
        html += `<div class="result-content" id="currContent">${escapeHtml(d.text)}</div>`;
      }

      html += '</div>';
      return html;
    }

    // ===== 核心處理 =====
    function decodeImage(img) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width || img.videoWidth;
      canvas.height = img.height || img.videoHeight;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
      return code ? code.data : null;
    }

    function processResult(text) {
      if (!text) {
        showToast('未能識別 QR Code', 'error');
        return;
      }

      if (currentData) {
        history.unshift(currentData);
        if (history.length > 10) history = history.slice(0, 10);
      }

      const parsed = parseQR(text);
      currentData = {
        ...parsed,
        time: Date.now()
      };

      saveToStorage();
      renderCurrent();
      renderHistory();
      showToast('解讀成功！');
    }

    function renderCurrent() {
      const el = document.getElementById('currentResult');
      if (!currentData) {
        el.className = 'current-result empty';
        el.innerHTML = '尚未掃描任何 QR Code';
        return;
      }

      el.className = 'current-result';
      el.innerHTML = `
        <div class="result-header">
          <span class="result-type">${currentData.type}</span>
          <span>${formatTime(currentData.time)}</span>
        </div>
        ${renderStructured(currentData)}
        ${currentData.type === '文字' ? '<div class="expand-btn" id="currExpand" style="display:none">展開全部</div>' : ''}
      `;

      if (currentData.type === '文字') {
        const contentEl = document.getElementById('currContent');
        const expandBtn = document.getElementById('currExpand');
        if (contentEl && contentEl.scrollHeight > 140) {
          contentEl.classList.add('collapsed');
          expandBtn.style.display = 'inline-block';
          expandBtn.onclick = () => toggleExpand(contentEl, expandBtn);
        }
      }
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (history.length === 0) {
        list.innerHTML = '<div style="color:var(--text-muted);font-size:0.9rem;padding:12px 0">暫無歷史記錄</div>';
        return;
      }

      list.innerHTML = history.map((item, idx) => {
        let body = '';
        if (item.type === '文字') {
          body = `<div class="content" id="histContent${idx}">${escapeHtml(item.raw)}</div>
                  <div class="expand-btn" id="histExpand${idx}" style="display:none">展開全部</div>`;
        } else {
          body = renderStructured(item);
        }

        return `
          <div class="history-item">
            <div class="meta">
              <span class="result-type">${item.type}</span>
              <span>${formatTime(item.time)}</span>
            </div>
            ${body}
          </div>
        `;
      }).join('');

      history.forEach((item, idx) => {
        if (item.type === '文字') {
          const contentEl = document.getElementById(`histContent${idx}`);
          const expandBtn = document.getElementById(`histExpand${idx}`);
          if (contentEl && contentEl.scrollHeight > 80) {
            contentEl.classList.add('collapsed');
            expandBtn.style.display = 'inline-block';
            expandBtn.onclick = () => toggleExpand(contentEl, expandBtn);
          }
        }
      });
    }

    function toggleExpand(contentEl, btn) {
      if (contentEl.classList.contains('collapsed')) {
        contentEl.classList.remove('collapsed');
        btn.textContent = '收合';
      } else {
        contentEl.classList.add('collapsed');
        btn.textContent = '展開全部';
      }
    }

    function clearHistory() {
      if (confirm('確定要清除所有歷史記錄？')) {
        history = [];
        saveToStorage();
        renderHistory();
        showToast('已清除歷史');
      }
    }

    // ===== 事件 =====
    document.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          const blob = item.getAsFile();
          const img = new Image();
          img.onload = () => processResult(decodeImage(img));
          img.src = URL.createObjectURL(blob);
          break;
        }
      }
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        processResult(decodeImage(img));
        e.target.value = '';
      };
      img.src = URL.createObjectURL(file);
    });

    const uploadBar = document.getElementById('uploadBar');
    uploadBar.addEventListener('dragover', (e) => { e.preventDefault(); uploadBar.classList.add('dragover'); });
    uploadBar.addEventListener('dragleave', () => uploadBar.classList.remove('dragover'));
    uploadBar.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadBar.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const img = new Image();
        img.onload = () => processResult(decodeImage(img));
        img.src = URL.createObjectURL(file);
      }
    });

    async function startCamera() {
      if (scanning) return;
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const video = document.getElementById('cameraVideo');
        video.srcObject = cameraStream;
        await video.play();
        document.getElementById('camera-container').style.display = 'block';
        scanning = true;
        requestAnimationFrame(scanFrame);
      } catch (err) {
        showToast('無法開啟相機：' + err.message, 'error');
      }
    }

    function stopCamera() {
      scanning = false;
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
      document.getElementById('camera-container').style.display = 'none';
    }

    function scanFrame() {
      if (!scanning) return;
      const video = document.getElementById('cameraVideo');
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const result = decodeImage(video);
        if (result) {
          processResult(result);
          stopCamera();
          return;
        }
      }
      requestAnimationFrame(scanFrame);
    }

    loadFromStorage();
  </script>
</body>
</html>
