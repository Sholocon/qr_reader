<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code 即時解讀</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: rgba(30, 41, 59, 0.75);
      --border: rgba(148, 163, 184, 0.18);
      --accent: #818cf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      min-height: 480px;
      max-height: 580px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      background-image:
        radial-gradient(circle at 15% 25%, rgba(99,102,241,0.15) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(129,140,248,0.12) 0%, transparent 45%);
    }

    header {
      text-align: center;
      margin-bottom: 14px;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a5b4fc, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .result {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      min-height: 110px;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
    }
    .result.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .type-badge {
      background: rgba(99,102,241,0.25);
      color: #a5b4fc;
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.72rem;
    }

    .structured {
      background: rgba(15,23,42,0.55);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.88rem;
    }
    .row:last-child { margin-bottom: 0; }
    .label {
      min-width: 58px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .value { flex: 1; word-break: break-all; }
    .value a { color: #a5b4fc; text-decoration: none; }
    .value a:hover { text-decoration: underline; }

    .copy-btn {
      background: rgba(99,102,241,0.2);
      color: #a5b4fc;
      border: none;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      cursor: pointer;
      margin-left: 6px;
    }
    .copy-btn:hover { background: rgba(99,102,241,0.35); }

    .text-content {
      word-break: break-all;
      white-space: pre-wrap;
      font-size: 0.92rem;
      max-height: 160px;
      overflow-y: auto;
    }

    .upload-area {
      background: var(--card);
      border: 2px dashed rgba(148,163,184,0.28);
      border-radius: 14px;
      padding: 18px 12px;
      text-align: center;
      margin-bottom: 14px;
      transition: all 0.2s;
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: var(--accent);
      background: rgba(99,102,241,0.1);
    }
    .upload-area p {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 12px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn-secondary {
      background: rgba(51,65,85,0.85);
    }

    #fileInput { display: none; }

    #cameraBox {
      display: none;
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #000;
    }
    #cameraBox video { width: 100%; display: block; }
    #cameraBox .close-btn {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(0,0,0,0.65);
      color: white;
      border: none;
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .footer-link {
      text-align: center;
      margin-top: 8px;
    }
    .footer-link a {
      color: #a5b4fc;
      font-size: 0.8rem;
      text-decoration: none;
    }
    .footer-link a:hover { text-decoration: underline; }

    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 50;
      border: 1px solid rgba(148,163,184,0.2);
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #7f1d1d; }
  </style>
</head>
<body>
  <header>
    <h1>QR Code 即時解讀</h1>
    <p>貼上 / 上傳 / 掃描 → 自動解讀</p>
  </header>

  <div id="result" class="result empty">尚未掃描任何 QR Code</div>

  <div id="cameraBox">
    <video id="video" playsinline></video>
    <button class="close-btn" id="closeCam">×</button>
  </div>

  <div class="upload-area" id="uploadArea">
    <p>📋 直接 <b>Ctrl + V</b> 貼上圖片</p>
    <div class="btn-row">
      <button class="btn" id="uploadBtn">📁 上傳圖片</button>
      <button class="btn btn-secondary" id="camBtn">📷 掃描</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" />
  </div>

  <div class="footer-link">
    <a href="https://sholocon.github.io/qr_reader/qr_reader.html" target="_blank">
      開啟完整網頁版（含歷史記錄）→
    </a>
  </div>

  <div id="toast" class="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
